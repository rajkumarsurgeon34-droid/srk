name: Build SRK VPN Android APK

on:
  push:
    branches: [main]
    paths: ['vpn-app/**', '.github/workflows/build-vpn-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error:|e: |What went wrong|FAILURE|Exception|Could not|> " build.log | grep -v "^> Task" | head -20 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Check the APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -p "$APK" 'classes*.dex' | grep -a -q 'Lin/shazverse/srkvpn/MainActivity;' || { echo 'ERROR: MainActivity missing'; exit 1; }
          unzip -l "$APK" | grep -q 'assets/www/index.html' || { echo 'ERROR: app pages missing'; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwg-go.so' || { echo 'ERROR: WireGuard native library missing'; exit 1; }
          cp "$APK" SRK-VPN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRK-VPN-apk
          path: vpn-app/SRK-VPN.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "vpn-v1.0.${{ github.run_number }}" SRK-VPN.apk \
            --title "SRK VPN 1.0 (build ${{ github.run_number }})" \
            --notes "Download SRK-VPN.apk below and open it on your Android phone to install."
