name: Test SRK Torrent engine

on:
  push:
    branches: [main]
    paths: ['torrent-engine/**', '.github/workflows/test-torrent-engine.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrent-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download libtorrent4j
        shell: bash
        run: |
          set -e
          V=$(cat LT4J_VERSION)
          M=https://repo1.maven.org/maven2/org/libtorrent4j
          curl -fsSL "$M/libtorrent4j/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | tail -5 | tee versions.txt
          mkdir -p lib
          curl -fsSL -o lib/libtorrent4j.jar "$M/libtorrent4j/$V/libtorrent4j-$V.jar" || { V=$(curl -fsSL "$M/libtorrent4j/maven-metadata.xml" | grep -o '<release>[^<]*' | cut -c10-); echo "fallback to $V"; curl -fsSL -o lib/libtorrent4j.jar "$M/libtorrent4j/$V/libtorrent4j-$V.jar"; }
          echo "$V" > LT4J_VERSION
          curl -fsSL -o lib/libtorrent4j-linux.jar "$M/libtorrent4j-linux/$V/libtorrent4j-linux-$V.jar"
          (cd lib && unzip -o -q libtorrent4j-linux.jar && find . -name '*.so')
      - name: Compile
        run: javac -encoding UTF-8 -cp lib/libtorrent4j.jar -d out src/in/shazverse/srktorrent/*.java
      - name: Run self-test
        shell: bash
        run: |
          SO=$(find "$PWD/lib" -name 'libtorrent4j.so' | head -1)
          timeout 600 java -Dlibtorrent4j.jni.path="$SO" -cp out:lib/libtorrent4j.jar in.shazverse.srktorrent.SelfTest /tmp/st report.txt 2>&1 | tail -50
          tail -3 report.txt
          { echo "libtorrent4j $(cat LT4J_VERSION)"; echo "latest versions on Maven:"; cat versions.txt; } >> report.txt
          grep -q "RESULT .* 0 failed" report.txt
      - name: Report
        if: always()
        shell: bash
        run: |
          [ -f report.txt ] || echo "no report" > report.txt
          grep -E "FAIL|RESULT" report.txt | head -20 | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "torrent-test-${{ github.run_number }}" report.txt --prerelease --title "SRK Torrent engine test ${{ github.run_number }}" --notes "Automated engine test"
