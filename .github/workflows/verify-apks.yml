name: Verify APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect with Android tools
        shell: bash {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ${{ inputs.tag }} -R ${{ github.repository }} -p SRK-Docs.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          {
            echo "build-tools: $BT"
            for A in SRK-Docs.apk; do
              echo "===== $A size $(stat -c%s $A)"
              "$BT/apksigner" verify --verbose "$A" 2>&1 | grep -v WARNING
              echo "--- badging"; "$BT/aapt2" dump badging "$A" 2>&1 | head -40
              echo "--- manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$A" 2>&1
            done
          } > apk-report.txt 2>&1
          gh release upload ${{ inputs.tag }} apk-report.txt --clobber -R ${{ github.repository }}
