<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>SRK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Dancing+Script:wght@600&family=Great+Vibes&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one-screen app — slim header, working area, bottom tab bar (thumb reach on phones).
   Tools home mirrors a toolbox: categories, each with a colour-coded row of tool tiles. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --sunk:#e3e6ee; --ink:#1b2236; --muted:#5d6580;
  --line:#d3d8e4; --accent:#2f4fd8; --accent-ink:#ffffff; --accent-soft:#e2e8ff;
  --warn:#b4471b; --ok:#1d7a4f; --desk:#d9dde7; --shadow:0 1px 2px rgb(20 28 60/.08),0 6px 18px rgb(20 28 60/.08);
  --c-org:#e0603f; --c-opt:#3f9a5a; --c-to:#d59a12; --c-from:#2f74c9; --c-edit:#9a4fb3; --c-sec:#3d6a9e; --c-ai:#6248e0;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151f; --surface:#1b2030; --sunk:#151a27; --ink:#e6e9f3; --muted:#9aa2bd;
  --line:#2c3348; --accent:#7d95ff; --accent-ink:#0f1430; --accent-soft:#252e52;
  --warn:#f08a5d; --ok:#5ccf98; --desk:#0d1018; --shadow:0 1px 2px rgb(0 0 0/.4),0 6px 18px rgb(0 0 0/.35);
  --c-org:#f08566; --c-opt:#5fbf7c; --c-to:#e9b53c; --c-from:#5e9ce6; --c-edit:#be7ad6; --c-sec:#6f98c8; --c-ai:#8f7bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --surface:#1b2030; --sunk:#151a27; --ink:#e6e9f3; --muted:#9aa2bd;
  --line:#2c3348; --accent:#7d95ff; --accent-ink:#0f1430; --accent-soft:#252e52;
  --warn:#f08a5d; --ok:#5ccf98; --desk:#0d1018; --shadow:0 1px 2px rgb(0 0 0/.4),0 6px 18px rgb(0 0 0/.35);
  --c-org:#f08566; --c-opt:#5fbf7c; --c-to:#e9b53c; --c-from:#5e9ce6; --c-edit:#be7ad6; --c-sec:#6f98c8; --c-ai:#8f7bff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.docname{flex:1;min-width:0;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:40px;padding:0}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.icon.sm{width:32px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.filepick{position:relative;overflow:hidden;cursor:pointer}
.filepick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fileover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:60px;margin:0;padding:0;z-index:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0;flex:1 1 150px}
label.f.narrow{flex:0 1 130px}
.col>label.f,.panel>label.f,.col>label.chk,.panel>label.chk{flex:0 0 auto}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:40px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.inp{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea.inp{min-height:160px;resize:vertical;line-height:1.55}
input[type=color].inp{padding:4px;height:40px}
input[type=range]{accent-color:var(--accent);width:100%}
.unit{display:flex;gap:6px}.unit .inp{flex:1}.unit select.inp{flex:0 0 76px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;min-height:38px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:13px;margin:0}
.okmsg{color:var(--ok);font-size:13px;margin:0}
.sub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}

/* Reader */
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.grp{display:inline-flex;align-items:center;gap:4px}
.pager{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager input{width:52px;min-height:40px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--f-mono)}
.zoomlbl{font-family:var(--f-mono);font-size:13px;min-width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.desk{flex:1;min-height:0;overflow:auto;background:var(--desk);padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.pages{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:min-content}
.pg{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:2px;flex:none}
.pg canvas{display:block;width:100%;height:100%}
.pg .num{position:absolute;right:-2px;bottom:-20px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.night .pg canvas{filter:invert(.92) hue-rotate(180deg)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.status{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* Tools home */
.scroll{flex:1;min-height:0;overflow:auto;padding-block:16px 32px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cat h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:56px;color:var(--ink)}
.tile:hover{border-color:var(--tc)}
.tile .ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-weight:600;font-size:14px;line-height:1.25}
.tile.ai .tag{font-size:10px;font-weight:600;color:var(--c-ai);letter-spacing:.06em;text-transform:uppercase;display:block}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px;line-height:1.45}
.notice b{font-weight:600}

/* Tool panel */
.toolhead{display:flex;align-items:center;gap:10px}
.toolhead .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);flex:none}
.toolhead h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.toolhead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.srcinfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.srcinfo span.t{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);flex-wrap:wrap}
.item .th{width:44px;height:56px;flex:none;border-radius:4px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.item .meta{flex:1 1 140px;min-width:0}
.item .meta b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.item .ord{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px;text-align:center;flex:none}
.empty{font-size:13px;color:var(--muted);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.result{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent)}
.result h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.stats{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:0}
.textout{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;font-size:14px;line-height:1.6;margin:0}
.progress{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* page grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pcell{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:10px;border:2px solid transparent;background:var(--bg);cursor:pointer;user-select:none}
.pcell .pth{width:100%;aspect-ratio:1/1.3;display:grid;place-items:center;overflow:hidden}
.pcell canvas{max-width:100%;max-height:100%;box-shadow:var(--shadow);background:#fff;transition:transform .2s}
.pcell .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pcell.sel{border-color:var(--accent);background:var(--accent-soft)}
.pcell.del{opacity:.45}
.pcell.del .pth::after{content:"";position:absolute;inset:6px 6px 26px;background:linear-gradient(to top right,transparent calc(50% - 2px),var(--warn) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px))}
.pcell .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;font-size:13px;font-weight:700}
.pcell.sel .tick{display:grid}
.pcell .acts{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.pcell .acts .btn{min-height:28px;width:28px;padding:0;font-size:13px;border-radius:7px}

/* scanner + annotator stages */
.stagewrap{display:flex;justify-content:center;width:100%;background:var(--desk);border-radius:12px;padding:14px;overflow:hidden}
.scanstage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.scanstage canvas.main{display:block;border-radius:2px}
.hdl{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #fff;background:rgb(47 79 216/.3);box-shadow:0 0 0 1.5px #2f4fd8,0 2px 8px rgb(0 0 0/.45);touch-action:none;cursor:grab;z-index:4}
.loupe{position:absolute;top:8px;width:110px;height:110px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 12px rgb(0 0 0/.5);z-index:5;pointer-events:none}
.fixwrap{display:flex;justify-content:center;background:var(--desk);border-radius:12px;padding:14px}
.fixwrap canvas{max-width:100%;max-height:60vh;width:auto;height:auto;box-shadow:var(--shadow);background:#fff}
.annlayer{position:absolute;inset:0;touch-action:none}
.aobj{position:absolute;touch-action:none;cursor:move}
.aobj.sel{outline:2px dashed var(--accent);outline-offset:2px}
.aobj img{width:100%;height:100%;display:block;pointer-events:none}
.aobj .txt{white-space:pre;line-height:1.2;pointer-events:none;font-family:Helvetica,Arial,sans-serif}
.aobj .rz{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:2px solid #fff;display:none;touch-action:none;cursor:nwse-resize}
.aobj.sel .rz{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sigpad{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
.sigtyped{font-size:42px;color:#1b2236;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;min-height:90px;display:flex;align-items:center;overflow:hidden}
.difftext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:55vh;overflow:auto;margin:0}
.difftext del{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);text-decoration:line-through}
.difftext ins{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok);text-decoration:none}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twocol>*{min-width:0}
.twocol canvas{width:100%;height:auto;box-shadow:var(--shadow);background:#fff}
@media (max-width:520px){.twocol.stack{grid-template-columns:1fr}}

/* Tab bar */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em}
.tab[aria-selected="true"]{color:var(--accent)}
.tab svg{width:22px;height:22px}
.offscreen{position:fixed;left:-10000px;top:0;border:0;background:#fff}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.tab{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){.pcell canvas,.progress i{transition:none}}
</style>

<div class="app">
  <header class="top gut">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 2.5h8.5L19.5 7.5V21a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/><path d="M14.5 2.5v5h5" stroke="var(--accent)" stroke-width="1.6"/><path d="M8.5 12h7M8.5 15h7M8.5 18h4" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>
      SRK
    </div>
    <div class="docname" id="docname"></div>
  </header>

  <section class="view" id="view-read" hidden>
    <div class="rbar gut">
      <button class="btn primary" id="openBtn" type="button">Open PDF</button>
      <input type="file" id="openInput" accept="application/pdf,.pdf" hidden>
      <div class="pager">
        <button class="btn icon" id="prevBtn" type="button" aria-label="Previous page">‹</button>
        <input id="pageInput" inputmode="numeric" aria-label="Page number" value="1">
        <span id="pageTotal">/ –</span>
        <button class="btn icon" id="nextBtn" type="button" aria-label="Next page">›</button>
      </div>
      <div class="spacer"></div>
      <div class="grp">
        <button class="btn icon" id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <span class="zoomlbl" id="zoomLbl">Fit</span>
        <button class="btn icon" id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button class="btn" id="fitBtn" type="button">Fit</button>
        <button class="btn icon" id="nightBtn" type="button" aria-label="Night reading" title="Night reading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      </div>
    </div>
    <div class="desk" id="desk"><div class="pages" id="pages"></div></div>
  </section>

  <section class="view" id="view-tools">
    <div class="scroll gut" id="toolsScroll">
      <div class="wrap" id="toolsHome"></div>
      <div class="wrap" id="toolPanel" hidden></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="false" data-tab="read" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 5.5C5 4 8.5 4 12 6c3.5-2 7-2 9.5-.5V19c-2.5-1.5-6-1.5-9.5.5-3.5-2-7-2-9.5.5Z"/><path d="M12 6v13.5"/></svg>Read</button>
    <button class="tab" role="tab" aria-selected="true" data-tab="tools" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tools</button>
  </nav>
</div>
<div class="status" id="status" hidden></div>

<script src="libs/pdf.js"></script>
<script src="libs/pdf-lib.min.js"></script>
<script src="libs/jszip.min.js"></script>
<script src="native.js"></script>
<script src="core.js"></script>
<script src="office.js"></script>
<script src="pdfcrypt.js"></script>
<script src="widgets.js"></script>
<script src="tools-a.js"></script>
<script src="tools-b.js"></script>
<script src="tools-c.js"></script>
<script src="app.js"></script>
