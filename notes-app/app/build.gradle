plugins {
    id 'com.android.application'
}

android {
    namespace 'in.shazverse.srknotes'
    compileSdk 35

    defaultConfig {
        applicationId 'in.shazverse.srknotes'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        // phones only: leave out the emulator (x86) copies of the handwriting library
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // A fixed key, so every new build installs over the old one without uninstalling
    signingConfigs {
        srk {
            storeFile file('srk.keystore')
            storePassword 'srk-store-2026'
            keyAlias 'srk'
            keyPassword 'srk-store-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.srk
        }
        debug {
            signingConfig signingConfigs.srk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'html', 'css', 'txt'
    }
}

dependencies {
    // keep all Kotlin standard-library pieces on one version (AndroidX pulls in mixed ones)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // offline handwriting recognition (Ink to Text); language models download once on first use
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
}
