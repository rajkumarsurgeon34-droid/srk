plugins {
    id 'com.android.application'
}

def srkKeystore = System.getenv('SRK_KEYSTORE')
def srkBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'in.shazverse.srknotes'
    compileSdk 35

    defaultConfig {
        applicationId 'in.shazverse.srknotes'
        minSdk 23
        targetSdk 35
        versionCode(100 + srkBuild)   // goes up with every GitHub build
        versionName "1.0.${srkBuild}"   // matches the release tag
        // phones only: leave out the emulator (x86) copies of the handwriting library
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Release key: decrypted by GitHub Actions from signing/srk-release.keystore.enc
    // using the SRK_SIGNING_PASSWORD secret. Never commit a plain keystore or password.
    signingConfigs {
        srk {
            if (srkKeystore) {
                storeFile file(srkKeystore)
                storePassword System.getenv('SRK_KEY_PASSWORD')
                keyAlias 'srk'
                keyPassword System.getenv('SRK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig(srkKeystore ? signingConfigs.srk : signingConfigs.debug)
        }
        debug {
            if (srkKeystore) signingConfig signingConfigs.srk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'html', 'css', 'txt'
    }
}

dependencies {
    // keep all Kotlin standard-library pieces on one version (AndroidX pulls in mixed ones)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    // offline handwriting recognition (Ink to Text); language models download once on first use
    implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
}
