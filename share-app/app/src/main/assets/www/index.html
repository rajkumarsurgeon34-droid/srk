<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>SRK Share</title>
<style>
/* Layout: one screen — who you are, who is nearby (tap to pick), what you're sending, and the activity list. SRK family tokens with Share teal. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --sunk:#e3e9eb; --ink:#14232a; --muted:#56707a; --line:#d0dadd;
  --accent:#0B8A87; --accent-ink:#ffffff; --accent-soft:#d7efee; --warn:#b4471b; --ok:#1e8e3e;
  --shadow:0 1px 2px rgb(10 30 40/.10),0 8px 24px rgb(10 30 40/.12);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1719;--surface:#172225;--sunk:#121b1d;--ink:#e3eef0;--muted:#94adb4;--line:#26363a;--accent:#3cc7c2;--accent-ink:#04201f;--accent-soft:#16393a;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1719;--surface:#172225;--sunk:#121b1d;--ink:#e3eef0;--muted:#94adb4;--line:#26363a;--accent:#3cc7c2;--accent-ink:#04201f;--accent-soft:#16393a;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:disabled{opacity:.45;cursor:default}.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}.btn.danger{color:var(--warn)}
.btn svg,.ib svg{width:20px;height:20px}
.ib{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--ink);flex:none}.ib:hover{background:var(--sunk)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:0}
header{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}.logo svg{width:22px;height:22px}
.brand{flex:1;min-width:0}.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}
.me{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:13px;max-width:100%}.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me svg{width:14px;height:14px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 rgb(30 142 62/.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgb(30 142 62/0)}100%{box-shadow:0 0 0 0 rgb(30 142 62/0)}}
@media (prefers-reduced-motion:reduce){.dot,.scan::after{animation:none}}
main{flex:1;min-height:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.wrap{max-width:980px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.peer{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border:2px solid transparent;border-radius:16px;background:var(--surface);cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.peer.on{border-color:var(--accent);background:var(--accent-soft)}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;position:relative}
.av .pl{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}.av .pl svg{width:15px;height:15px}
.peer b{font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.peer small{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.peer .tick{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}.peer.on .tick{display:grid}.peer .tick svg{width:14px;height:14px}
.scan{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.scan .radar{position:relative;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}.scan .radar svg{width:30px;height:30px}
.scan::after{content:"";position:absolute;top:26px;left:50%;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:sonar 2.2s infinite}
@keyframes sonar{0%{transform:scale(.9);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.scan p{margin:0;max-width:420px}
.tray{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 6px 5px 10px;border-radius:999px;background:var(--sunk);font-size:13px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}.chip small{color:var(--muted)}.chip button{border:0;background:none;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0}.chip button:hover{background:var(--line)}.chip button svg{width:14px;height:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row .grow{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.tr .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);grid-row:span 2}.tr .ic svg{width:20px;height:20px}
.tr.in .ic{color:var(--accent);background:var(--accent-soft)}
.tr b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tr .meta{font-size:12px;color:var(--muted);grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.tr .acts{grid-row:span 2;display:flex;gap:4px;align-items:center}
.bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.tr.done .meta{color:var(--ok)}.tr.failed .meta,.tr.cancelled .meta,.tr.declined .meta{color:var(--warn)}
.txt{white-space:pre-wrap;word-break:break-word;font-size:14px;grid-column:2/3}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.scrim{position:fixed;inset:0;background:rgb(5 15 20/.5);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column}
.dlg h3{margin:0;padding:18px 18px 4px;font:700 18px var(--f-display)}.dlg .db{padding:8px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 18px;flex-wrap:wrap}
.flist{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto;background:var(--bg);border-radius:12px;padding:8px 10px}.flist div{display:flex;gap:10px;font-size:13px}.flist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.flist small{color:var(--muted);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--accent)}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 12px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}.mi:hover{background:var(--sunk)}.mi svg{width:18px;height:18px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12262b;color:#fff;padding:10px 16px;border-radius:12px;z-index:70;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--accent-soft) 85%,transparent);z-index:40;display:grid;place-items:center;font:700 20px var(--f-display);color:var(--accent);pointer-events:none}
.addr{font-family:var(--f-mono);font-size:15px;background:var(--bg);border-radius:10px;padding:10px 12px;user-select:all}
.noapp{margin:auto;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:30px 20px}
.noapp .logo{width:64px;height:64px;border-radius:18px}.noapp .logo svg{width:36px;height:36px}
</style></head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <div class="brand"><b>SRK Share</b><button class="me" id="meBtn" title="Change this device’s name"><i class="dot"></i><span id="meName">Starting…</span></button></div>
  <button class="ib" id="moreBtn" aria-label="More" title="More"></button>
</header>
<main><div class="wrap" id="wrap"></div></main>
<script src="share.js"></script>
</body></html>
