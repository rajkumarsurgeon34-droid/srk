<title>SRK Slides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen presentation editor — app bar, ribbon, then slide strip + stage + notes; full-screen slideshow overlay.
   Start screen shows templates as real first slides. Shares SRK's blue, with a warm orange for the slide-show accent. */
:root{
  --bg:#eceef3; --surface:#ffffff; --sunk:#e2e5ed; --ink:#1b2236; --muted:#5b6380; --line:#d2d7e3;
  --accent:#2f4fd8; --accent-ink:#ffffff; --accent-soft:#e2e8ff; --desk:#d6dae4; --warn:#b4471b; --ok:#1d7a4f; --show:#e0603f;
  --shadow:0 1px 2px rgb(20 28 60/.10),0 8px 24px rgb(20 28 60/.12);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151f; --surface:#1b2030; --sunk:#151a27; --ink:#e6e9f3; --muted:#9aa2bd; --line:#2c3348;
  --accent:#7d95ff; --accent-ink:#0f1430; --accent-soft:#252e52; --desk:#0e1119; --warn:#f08a5d; --ok:#5ccf98; --show:#f08566;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --surface:#1b2030; --sunk:#151a27; --ink:#e6e9f3; --muted:#9aa2bd; --line:#2c3348;
  --accent:#7d95ff; --accent-ink:#0f1430; --accent-soft:#252e52; --desk:#0e1119; --warn:#f08a5d; --ok:#5ccf98; --show:#f08566;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px rgb(0 0 0/.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{height:100%;display:flex;flex-direction:column}
.view[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.show{background:var(--show);color:#fff;border-color:var(--show)}
.btn.danger{color:var(--warn)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;border:0;background:transparent;cursor:pointer;color:var(--ink);flex:none}
.ib:hover{background:var(--sunk)}
.ib svg{width:20px;height:20px}
.ib[disabled]{opacity:.35;cursor:default}
.filepick{position:relative;overflow:hidden;cursor:pointer}
.fileover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:60px;margin:0;padding:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.inp{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:6px 10px;font-size:15px;color:var(--ink);width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}

/* ---------- start ---------- */
.start-scroll{flex:1;min-height:0;overflow:auto;padding-block:20px 40px}
.start-wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.brandrow{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--show);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;flex:none}
.brandrow h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em}
.brandrow p{margin:0;color:var(--muted);font-size:13px}
.sec h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.tpl{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.tpl .mini{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;box-shadow:var(--shadow);overflow:hidden;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s;background:#fff}
.tpl:hover .mini,.tpl:focus-visible .mini{outline-color:var(--accent)}
.tpl b{font-size:13px;font-weight:600}
.tpl small{font-size:12px;color:var(--muted);margin-top:-6px}
.openrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.recent{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.rrow:first-child{border-top:0}
.rrow .rmini{width:64px;aspect-ratio:16/9;flex:none;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#fff;position:relative}
.rrow .meta{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:4px 0;color:var(--ink)}
.rrow .meta b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .meta small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.notice{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px;line-height:1.45}

/* ---------- editor chrome ---------- */
.bar{display:flex;align-items:center;gap:4px;padding-block:6px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .title{flex:1;min-width:60px;border:1px solid transparent;border-radius:8px;background:transparent;padding:6px 8px;font-weight:600;font-size:16px;color:var(--ink);text-overflow:ellipsis}
.bar .title:hover{border-color:var(--line)}
.bar .title:focus{border-color:var(--accent);background:var(--bg);outline:none}
.saved{font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
@media (max-width:560px){.saved{display:none}}
.playbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:0;background:var(--show);color:#fff;font-weight:600;font-size:14px;cursor:pointer;flex:none}
.playbtn svg{width:16px;height:16px}
@media (max-width:420px){.playbtn span{display:none}}
.rtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);padding-top:2px}
.rtabs::-webkit-scrollbar{display:none}
.rtab{border:0;background:none;padding:8px 12px 7px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;flex:none}
.rtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.rtab.ctx{color:var(--ok)}
.rtab.ctx[aria-selected="true"]{color:var(--ok);border-bottom-color:var(--ok)}
.rtab.file{color:var(--accent);font-weight:600}
.ribbon{display:flex;align-items:stretch;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding-block:6px;scrollbar-width:thin;min-height:62px}
.grp{display:flex;flex-direction:column;align-items:stretch;padding:0 8px;border-left:1px solid var(--line);flex:none}
.grp:first-child{border-left:0;padding-left:0}
.grp .row{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.grp .gl{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.04em;margin-top:2px;white-space:nowrap}
.rb{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:36px;height:36px;padding:0 7px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;color:var(--ink);font-size:13px;white-space:nowrap;flex:none}
.rb:hover{background:var(--sunk)}
.rb.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.rb[disabled]{opacity:.35;cursor:default}
.rb svg{width:19px;height:19px;flex:none}
.rb .caret{width:10px;height:10px;opacity:.6}
.rb .sw{display:block;width:18px;height:4px;border-radius:2px;margin-top:-2px}
.rsel{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 6px;font-size:13.5px;color:var(--ink);flex:none}
.rsel.font{width:150px}
.fontbtn{display:inline-flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer;text-align:left}
.fontbtn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.fontbtn[disabled]{opacity:.5;cursor:default}
.fontpop{width:300px;display:flex;flex-direction:column}
.fontpop .fontlist{overflow:auto;max-height:52vh}
.fontpop .mi span{overflow:hidden;text-overflow:ellipsis}.rsel.size{width:64px}
.work{flex:1;min-height:0;display:flex;background:var(--desk)}
.thumbs{flex:none;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:12px 10px 40px 8px;width:188px}
.thumb{display:flex;gap:6px;align-items:flex-start;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;text-align:left}
.thumb .tn{width:16px;text-align:right;padding-top:2px;flex:none}
.thumb .tmini{position:relative;flex:1;aspect-ratio:var(--ar,16/9);border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#fff}
.thumb[aria-current="true"] .tmini{box-shadow:0 0 0 2.5px var(--accent)}
.thumb[aria-current="true"] .tn{color:var(--accent);font-weight:600}
.thumb .tr{position:absolute;right:3px;bottom:3px;background:rgb(0 0 0/.55);color:#fff;border-radius:3px;font-size:9px;padding:0 3px}
.addslide{border:1.5px dashed var(--line);border-radius:6px;background:none;color:var(--muted);padding:10px;cursor:pointer;font-size:13px;margin-left:22px}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.stagewrap{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:20px}
.stageouter{position:relative;box-shadow:var(--shadow);flex:none}
.notes{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:8px;display:flex;flex-direction:column;gap:4px}
.notes textarea{width:100%;min-height:70px;max-height:30vh;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;font-size:14px;color:var(--ink)}
.notes .nl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:899px){
  .work{flex-direction:column-reverse}
  .thumbs{width:auto;height:96px;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));align-items:flex-start;overflow-y:hidden}
  .thumb{flex-direction:column-reverse;align-items:center;gap:2px}
  .thumb .tmini{width:110px;flex:none}
  .thumb .tn{width:auto;padding:0}
  .addslide{margin:0;height:62px;flex:none;width:62px;padding:0}
  .stagewrap{padding:12px}
}
.status{display:flex;align-items:center;gap:8px;padding-block:4px;background:var(--surface);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:38px}
.status .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .ib{width:32px;height:32px}
.status .vt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.status .vt.on{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- the slide ---------- */
.slide{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff;color:#000;-webkit-user-select:none;user-select:none}
.slide svg.deco{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.obj{position:absolute;transform-origin:50% 50%}
.variants{display:flex;gap:6px;align-items:center}
.variants button{width:60px;height:34px;padding:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;position:relative;cursor:pointer;background:#fff}
.variants button.on{outline:2.5px solid var(--accent);outline-offset:1px}
.bgstyles{display:grid;grid-template-columns:repeat(4,60px);gap:6px}
.bgstyles button{width:60px;height:34px;border:1px solid var(--line);border-radius:5px;cursor:pointer;padding:0}
.gradrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.gradrow input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:none}
.bgpop{width:300px}
.obj svg.geo{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.obj .tx{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.6px 7.2px;overflow:visible}
.obj .tx[data-a="ctr"]{justify-content:center}.obj .tx[data-a="b"]{justify-content:flex-end}
.obj .tc{outline:none;line-height:1.15;overflow-wrap:break-word;min-height:1em}
.obj .tc p{margin:0}
.obj .tc ul,.obj .tc ol{margin:0;padding-left:1.15em}
.obj .tc li{margin:0 0 .15em}
.obj .tc li::marker{color:var(--bullet,currentColor)}
.obj .tc sup,.obj .tc sub{font-size:.65em}
.obj .tc[contenteditable="true"]{-webkit-user-select:text;user-select:text;cursor:text}
.obj .tc:empty::before{content:attr(data-prompt);opacity:.45}
.slide.noprompt .obj .tc:empty::before{content:none}
.slide.noprompt .obj.ph-empty{display:none}
.obj .imgwrap{position:absolute;inset:0;overflow:hidden}
.obj .imgborder{position:absolute;inset:0;pointer-events:none;box-sizing:border-box}
.obj .tc p{margin-bottom:var(--pa,0)}
.obj .tc li{margin-bottom:var(--pa,.15em)}
.obj .tc a{color:inherit;text-decoration:underline}
.obj svg.chart,.obj svg.ink{position:absolute;inset:0;overflow:visible}
.slide .hf{pointer-events:none;opacity:.75}
.selbox.multi{border-style:dashed}
.marq{position:absolute;border:1px dashed #2f4fd8;background:rgb(47 79 216/.08);pointer-events:none;z-index:6}
.slide.grid{background-image:linear-gradient(rgb(0 0 0/.08) 1px,transparent 1px),linear-gradient(90deg,rgb(0 0 0/.08) 1px,transparent 1px)!important}
.gridov{position:absolute;inset:0;pointer-events:none;z-index:4;background-image:linear-gradient(rgb(90 100 140/.22) 1px,transparent 1px),linear-gradient(90deg,rgb(90 100 140/.22) 1px,transparent 1px);background-size:24px 24px}
.thumb.hidden .tmini{opacity:.4}
.thumb.hidden .tn{text-decoration:line-through}
.obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;-webkit-user-drag:none;pointer-events:none}
.obj table{width:100%;border-collapse:collapse;table-layout:fixed}
.obj td{border:.75px solid var(--tb,#7f7f7f);padding:3px 5px;vertical-align:middle;line-height:1.15;overflow-wrap:break-word}
.obj td p{margin:0}
.obj tr.hd td{font-weight:700}
.obj table[contenteditable="true"]{-webkit-user-select:text;user-select:text;outline:none}
.obj.ph-empty .tx{outline:1px dashed rgb(120 130 160/.7)}
.slide.noprompt .obj.ph-empty .tx{outline:none}
.selbox{position:absolute;pointer-events:none;border:1.5px solid #2f4fd8;transform-origin:50% 50%}
.selbox.editing{border-style:dashed}
.hdl{position:absolute;width:var(--hs);height:var(--hs);margin:calc(var(--hs)/-2) 0 0 calc(var(--hs)/-2);border-radius:50%;background:#fff;border:1.5px solid #2f4fd8;pointer-events:auto;touch-action:none}
.hdl.rot{background:#2f4fd8;border-color:#fff}
.hdl.rot::after{content:"";position:absolute;left:50%;top:100%;height:calc(var(--hs)*1.2);border-left:1.5px solid #2f4fd8}
.guide{position:absolute;pointer-events:none;background:#e0603f;z-index:5}
.marquee{display:none}
.stage-hit{position:absolute;inset:0}

/* popovers & dialogs */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;color:var(--ink);white-space:nowrap}
.pop .mi:hover{background:var(--sunk)}
.pop .mi.on{background:var(--accent-soft)}
.pop .mi svg{width:20px;height:20px;flex:none}
.pop .mi small{color:var(--muted);margin-left:auto;font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.pop .ph{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.swatches{display:grid;grid-template-columns:repeat(10,24px);gap:4px}
.swatches button{width:24px;height:24px;border-radius:5px;border:1px solid rgb(0 0 0/.15);cursor:pointer;padding:0}
.shapegrid{display:grid;grid-template-columns:repeat(6,40px);gap:4px}
.shapegrid button{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:6px}
.shapegrid svg{width:24px;height:24px}
.tgrid{display:grid;grid-template-columns:repeat(8,22px);gap:3px}
.tgrid i{display:block;width:22px;height:22px;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.tgrid i.on{background:var(--accent-soft);border-color:var(--accent)}
.layoutgrid{display:grid;grid-template-columns:repeat(3,108px);gap:8px}
.layoutgrid button{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--ink)}
.layoutgrid .lm{position:relative;width:94px;aspect-ratio:16/9;background:#fff;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,128px);gap:10px;max-width:580px}
.themegrid button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink);text-align:left}
.themegrid .tmm{position:relative;width:128px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.themegrid button.on .tmm{box-shadow:0 0 0 2.5px var(--accent)}
.dlg-back{position:fixed;inset:0;z-index:60;background:rgb(10 14 30/.45);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px;margin:0}
.stats dd{margin:0;font-family:var(--f-mono);text-align:right}
.stats dt{color:var(--muted)}
.filemenu{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column}
.filemenu .fm-scroll{flex:1;overflow:auto;padding-block:16px 40px}
.fm-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.fm-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink);font-size:15px;width:100%}
.fm-item:hover{background:var(--surface)}
.fm-item svg{width:22px;height:22px;color:var(--accent);flex:none}
.fm-item small{display:block;color:var(--muted);font-size:12.5px}
.fm-sep{height:1px;background:var(--line);margin:6px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;font-size:13.5px;z-index:90;max-width:calc(100% - 32px);text-align:center}
.offscreen{position:fixed;left:-20000px;top:0}

/* ---------- slideshow ---------- */
.show{position:fixed;inset:0;z-index:80;background:#000;overflow:hidden;touch-action:none;cursor:none}
.show .sstage{position:absolute;left:50%;top:50%}
.show .slide{box-shadow:none}
