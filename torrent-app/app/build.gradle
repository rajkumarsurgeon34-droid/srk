plugins {
    id 'com.android.application'
}

def lt4j = new File(rootDir, '../torrent-engine/LT4J_VERSION').text.trim()

def srkKeystore = System.getenv('SRK_KEYSTORE')
def srkBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'in.shazverse.srktorrent'
    compileSdk 35

    defaultConfig {
        applicationId 'in.shazverse.srktorrent'
        minSdk 28
        targetSdk 35
        versionCode(100 + srkBuild)   // goes up with every GitHub build
        versionName "1.0.${srkBuild}"   // matches the release tag
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // Release key: decrypted by GitHub Actions from signing/srk-release.keystore.enc
    // using the SRK_SIGNING_PASSWORD secret. Never commit a plain keystore or password.
    signingConfigs {
        srk {
            if (srkKeystore) {
                storeFile file(srkKeystore)
                storePassword System.getenv('SRK_KEY_PASSWORD')
                keyAlias 'srk'
                keyPassword System.getenv('SRK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig(srkKeystore ? signingConfigs.srk : signingConfigs.debug)
        }
        debug {
            if (srkKeystore) signingConfig signingConfigs.srk
        }
    }

    // the torrent engine is shared with the Windows app
    sourceSets {
        main {
            java {
                srcDirs += '../../torrent-engine/src'
                exclude '**/SelfTest.java', '**/StdioMain.java'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'html', 'css'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation "org.libtorrent4j:libtorrent4j:${lt4j}"
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:${lt4j}"
    implementation "org.libtorrent4j:libtorrent4j-android-arm:${lt4j}"
}
