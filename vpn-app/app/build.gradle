plugins {
    id 'com.android.application'
}

def srkKeystore = System.getenv('SRK_KEYSTORE')
def srkBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'in.shazverse.srkvpn'
    compileSdk 35

    defaultConfig {
        applicationId 'in.shazverse.srkvpn'
        minSdk 26
        targetSdk 35
        versionCode(100 + srkBuild)   // goes up with every GitHub build
        versionName "1.0.${srkBuild}"   // matches the release tag
        // x86_64 only so the build machine's Android emulator can run the end-to-end test
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    // Release key: decrypted by GitHub Actions from signing/srk-release.keystore.enc
    // using the SRK_SIGNING_PASSWORD secret. Never commit a plain keystore or password.
    signingConfigs {
        srk {
            if (srkKeystore) {
                storeFile file(srkKeystore)
                storePassword System.getenv('SRK_KEY_PASSWORD')
                keyAlias 'srk'
                keyPassword System.getenv('SRK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig(srkKeystore ? signingConfigs.srk : signingConfigs.debug)
        }
        debug {
            if (srkKeystore) signingConfig signingConfigs.srk
            applicationIdSuffix '.debug'
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'html', 'css'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.zxing:core:3.5.3'
}
