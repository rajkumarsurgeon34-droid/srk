<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SRK Office</title>
<style>
:root{--bg:#13151d;--card:#1c1f2b;--ink:#e7e9f2;--muted:#9ca3bd;--line:#2d3246}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:22px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;width:100%;max-width:680px}
button.app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-weight:600}
button.app:hover,button.app:focus-visible{border-color:#8c95b8;outline:none;transform:translateY(-1px)}
button.app img{width:64px;height:64px}
.open{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}.open:hover{background:var(--card)}
</style></head><body>
<h1>SRK Office</h1><p>Choose an app. Each one also has its own icon in the Start menu and on the desktop.</p>
<div class="grid">
  <button class="app" data-k="pdf"><img src="build/icons/pdf.png" alt="">SRK</button>
  <button class="app" data-k="docs"><img src="build/icons/docs.png" alt="">SRK Docs</button>
  <button class="app" data-k="slides"><img src="build/icons/slides.png" alt="">SRK Slides</button>
  <button class="app" data-k="sheets"><img src="build/icons/sheets.png" alt="">SRK Sheets</button>
  <button class="app" data-k="notes"><img src="build/icons/notes.png" alt="">SRK Notes</button>
</div>
<button class="open" id="open">Open a file…</button>
<script>
document.querySelectorAll('button.app').forEach(b => b.addEventListener('click', () => window.srkOffice.launch(b.dataset.k)));
document.getElementById('open').addEventListener('click', () => window.srkOffice.openFile());
</script>
</body></html>
